# The pool-maintenance project's one budget. It builds the workspace twice, so no
# per-change run reaches it: `just budgets` (which `just check` runs) excludes this
# project from its `budgets`/`budgets-host` fan-out, and CI runs this project's
# `budgets-host` only on the release PR, after the gate (`just pool-maintenance-budget`).
schema_version: 1
budgets:
  - id: github-secrets-pool-maintenance-seconds
    description: >-
      Wall-clock seconds one steady-state pass of this repository's declared pool
      maintenance takes, after one ordinary run's worth of superseded builds. It
      protects how long a regular post-run pass holds one of this repository's
      warm-pool slots out of service.
    labels: [host]
    measure: reported
    command: ["./measure.sh"]
    unit: seconds
    direction: max
    threshold: 20
