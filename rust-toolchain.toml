# The one toolchain pin for every crate in the workspace, locally and in CI (CI
# installs from this file rather than from a separate action pin).
#
# `llvm-tools` backs `cargo llvm-cov`, which the coverage gate runs. `targets`
# lists the release matrix in .github/workflows/release.yml, so a release build
# never reaches for a target the pinned toolchain lacks; keep the two in lockstep.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
