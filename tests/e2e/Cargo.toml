# The offline end-to-end suite: drives the compiled `gh-secrets` binary as a
# subprocess against wiremock and tempdirs. Test-only; never published. It takes
# no Cargo dependency on `gh-secrets` — it spawns the binary `gh-secrets:build`
# produces (see project.json), never links the library.
[package]
name = "gh-secrets-e2e"
version = "1.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# llmlint: ignore-block[e2e_not_mocked] these declare the suite's two boundary doubles, each already answered at its use site: wiremock is a real local HTTP server the spawned gh-secrets binary makes real requests to, and fake-bw is spawned through bw's real subprocess contract; the genuine GitHub and Bitwarden calls are the gh-secrets-live-github and gh-secrets-live-bitwarden projects. Every release PR's version bump puts this manifest in the judged diff.
[dev-dependencies]
assert_cmd.workspace = true
base64.workspace = true
predicates.workspace = true
tempfile.workspace = true
tokio.workspace = true
wiremock.workspace = true

# A stand-in `bw` the Bitwarden journeys put first on PATH (see
# tests/e2e_bitwarden.rs). A real subprocess double rather than a mock of the
# code under test: gh-secrets spawns it exactly as it spawns the real CLI.
[[bin]]
name = "fake-bw"
path = "support/fake_bw.rs"
test = false
# llmlint: ignore-end[e2e_not_mocked]

[dependencies]
serde_json.workspace = true
