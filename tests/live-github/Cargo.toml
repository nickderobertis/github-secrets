# The live GitHub suite: drives the compiled `gh-secrets` binary against the
# real GitHub API and runs scripts/install.sh against the real release. Each test
# is a runtime no-op unless GH_SECRETS_LIVE_TEST=1 and GH_TOKEN are set.
[package]
name = "gh-secrets-live-github"
version = "1.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
