# The `gh-secrets` crate, and the root of the Cargo workspace (one Cargo.lock).
# It stays the root package with a literal `version` because release-please's
# `rust` strategy needs exactly that (AGENTS.md "Stack and composition"); the
# members' versions follow it in lockstep (tools/check-restated-facts.mjs).
[package]
name = "gh-secrets"
version = "1.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A CLI for managing GitHub Actions repository secrets in bulk"
readme = "README.md"
keywords = ["github", "secrets", "cli", "actions"]
categories = ["command-line-utilities"]
# The suites live in their own member crates (tests/*, benches/), never here.
autotests = false
autobenches = false

[[bin]]
name = "gh-secrets"
path = "src/main.rs"

[lib]
name = "gh_secrets"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
crypto_box.workspace = true
dirs.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace]
# Explicit paths, not globs: release-please reads `<member>/Cargo.toml` verbatim
# to bump each member's version alongside the root crate's.
members = [
    "tests/e2e",
    "tests/live-github",
    "tests/live-bitwarden",
    "benches",
]
resolver = "2"

[workspace.package]
edition = "2021"
# The MSRV `just msrv` holds the crate to (clippy.toml's `msrv` must match). 1.86
# is the floor the locked dependency graph needs (icu_* 2.2 via idna <- url <-
# reqwest), so a lower value would be a promise `cargo build --locked` cannot keep.
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/nickderobertis/github-secrets"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
assert_cmd = "2.0"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
# Engine micro-benchmarks (`benches/benches/engine.rs`). default-features off
# keeps the plotters/gnuplot/rayon stack out of the build; `cargo_bench_support`
# is the only feature the harness needs, and critcmp reads the JSON Criterion
# writes regardless.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
crypto_box = { version = "0.9", features = ["seal"] }
dirs = "5.0"
gh-secrets = { path = "." }
predicates = "3.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Codegen-matched to `release` but with symbols kept, so cachegrind/callgrind in
# scripts/bench-instructions.sh count the shipped code path and a regression can
# still be annotated back to source afterwards.
[profile.profiling]
inherits = "release"
debug = true
strip = false
